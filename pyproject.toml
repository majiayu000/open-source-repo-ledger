[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-repo-ledger"
version = "0.1.0"
description = "Generate a public GitHub repository readiness ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "lif" }
]
keywords = ["github", "open-source", "repository", "ledger", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/majiayu000/open-source-repo-ledger"
Issues = "https://github.com/majiayu000/open-source-repo-ledger/issues"

[project.scripts]
oss-ledger = "oss_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

